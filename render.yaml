services:
  - type: web
    name: snaptrade-coinbase-connector
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SNAPTRADE_CLIENT_ID
        sync: false
      - key: SNAPTRADE_CONSUMER_KEY
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
